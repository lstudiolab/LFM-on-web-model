name: PyTorch training smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  torch-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
      - name: Run PyTorch train, checkpoint, evaluation and generation smoke tests
        run: python -m unittest discover -s tests -p "test_torch_training.py" -v
