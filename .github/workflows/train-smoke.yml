name: LFM training smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  train-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run complete training pipeline from one command
        run: >-
          python python/bootstrap_training.py
          --corpus data/samples/train.txt
          --validation-corpus data/samples/validation.txt
          --vocab-size 320 --steps 12 --hidden-size 8 --seq-len 16
          --checkpoint artifacts/smoke-checkpoint.npz
          --tokenizer-path artifacts/sora-tokenizer.json
          --eval-every 6 --eval-batches 2
          --generate-tokens 16 --token-cache-dir artifacts/cache
      - name: Compile C++ tokenizer utility
        run: c++ -std=c++17 -O2 -Wall -Wextra -pedantic cpp/main.cpp cpp/tokenizer.cpp -o artifacts/sora-tokenizer
      - name: Verify C++ tokenizer loads Python vocabulary
        run: ./artifacts/sora-tokenizer artifacts/sora-tokenizer.json "Sora mahal kita 😊" | grep -F "Decoded: Sora mahal kita 😊"
      - name: Verify checkpoint and metrics
        run: |
          test -s artifacts/smoke-checkpoint.npz
          test -s artifacts/smoke-checkpoint.metrics.jsonl
