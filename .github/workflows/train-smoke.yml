name: LFM pretraining smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pretraining-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise tokenizer, neural network, checkpoint, data split, resume and full corpus-to-checkpoint workflow
        run: python -m unittest discover -s tests -v
